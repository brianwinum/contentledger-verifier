name: Public verifier Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type: deploy development preview'
        required: true
        type: string

run-name: Public verifier ${{ github.event_name == 'workflow_dispatch' && 'development preview deployment' || 'validation' }}

permissions:
  contents: read

concurrency:
  group: public-verifier-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run the complete browser verifier test suite
        run: npm test

      - name: Authorize an explicit default-branch preview deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'deploy development preview'
          test "$REPOSITORY_VISIBILITY" = 'public'
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Prepare a repeated-build Pages candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CONTENTLEDGER_BROWSER_RELEASE_STATUS: development-preview
          CONTENTLEDGER_BROWSER_SOURCE_REVISION: ${{ github.sha }}
        run: npm run release:check

      - name: Verify and locate the exact Pages candidate
        if: github.event_name == 'workflow_dispatch'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(build-output/browser-release/run-*/artifact)
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            printf 'Expected exactly one prepared browser artifact; found %s.\n' "${#candidates[@]}" >&2
            exit 1
          fi
          artifact="${candidates[0]}"
          npm run release:verify -- "$artifact"
          jq -e --arg revision "$GITHUB_SHA" \
            '.status == "development-preview" and .provenance.releaseStatus == "development-preview" and .provenance.sourceRevision == $revision' \
            "$artifact/browser-release-manifest.json" >/dev/null
          printf 'app_path=%s/app\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the audited Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ steps.candidate.outputs.app_path }}
          retention-days: 1

  browser-e2e:
    name: Chromium, Firefox, and WebKit end-to-end checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install the pinned Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser end-to-end checks
        run: npm run test:e2e

      - name: Retain the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: public-verifier-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy development preview
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
      - browser-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy the exact audited artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
